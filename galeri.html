      <!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="2-Klb80tMvBDe_wYjErNAhDr6tYnyNWar053lMtBPEQ" />
     <link rel="icon" type="image/png" href="logo barPas.png">
    <title>BarPas - Barudak Pasirpirin</title>
    <style>
         /* --- 1. VARIABEL WARNA ELEGAN (LUXURY THEMING) --- */
        :root {
              /* Memanggil nama file gambar Anda */
    background-image: url('jagabaya.png'); 
    
    /* Membuat gambar memenuhi seluruh layar dan tidak terpotong */
    background-size: cover; 
    
    /* Membuat posisi gambar selalu pas berada di tengah-tengah layar */
    background-position: center; 
    
    /* Membuat gambar background tetap diam saat halaman di-scroll ke bawah */
    background-attachment: fixed; 
    
    /* Mencegah gambar berulang-ulang jika ukurannya terlalu kecil */
    background-repeat: no-repeat; 
    
    /* Warna cadangan jika gambar gagal dimuat akibat internet lambat */
    background-color: #0d0d0d; 
    
    color: #ffffff; /* Warna teks utama tetap putih agar terbaca */
            }
        /* --- 1. VARIABEL WARNA ELEGAN (LUXURY THEMING) --- */
        :root {
        
            --bg-surface: #17171c;    /* Warna permukaan kotak/kartu */
            --accent-gold: #ff6600;   /* Warna emas/oranye mewah untuk aksen */
            --accent-orange: #ffffff; /* Warna BarPas Anda */
            --text-primary: #f5f5f7;  /* Teks utama (putih pudar) */
            --text-muted: #f8f8fc;    /* Teks sekunder (abu-abu halus) */
            --border-color: #ff6600;  /* Garis pembatas halus */
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', system-ui, sans-serif;
        }

    
            body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Utama Slider */
        .slider-container {
            position: relative;
            width: 90%;
            max-width: 1000px; /* Maksimal lebar di PC */
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 8px 50px rgba(0,0,0,0.5);
        }

        /* Wrapper untuk Geser Slide */
        .slider-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        /* Elemen Tiap Slide */
        .slide {
            min-width: 100%;
            position: relative;
         /* Mengatur Aspek Rasio Video/Foto (16:9) */
            aspect-ratio: 16 / 9; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Style Foto dan Video agar Pas */
        .slide img, .slide video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Foto/Video memenuhi area tanpa distorsi */
        }

        /* Tombol Navigasi Kiri & Kanan */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 50%;
            transition: 0.3s;
            z-index: 10;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.8);
            color: black;
        }

        .prev { left: 15px; }
        .next { right: 15px; }

        /* Keterangan Teks Terbuka (Caption) */
        .caption {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Indikator Titik Bawah (Dots) */
        .dots-container {
            text-align: center;
            position: absolute;
            bottom: 15px;
            width: 100%;
            z-index: 10;
        }

        .dot {
            cursor: pointer;
            height: 12px;
            width: 12px;
            margin: 0 5px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: inline-block;
            transition: 0.3s;
        }

        .active, .dot:hover {
            background-color: white;
            transform: scale(1.2);
        }

        /* RESPONSIVE CSS UNTUK TAMPILAN HP */
        @media screen and (max-width: 768px) {
            .slider-container {
                width: 95%;
            }
            .nav-btn {
                padding: 10px;
                font-size: 14px;
                width: 35px;
                height: 35px;
            }
            .prev { left: 5px; }
            .next { right: 5px; }
            .caption {
                font-size: 11px;
                bottom: 10px;
                left: 10px;
            }
            .dot {
                height: 8px;
                width: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <!-- Wrapper Slide -->
        <div class="slider-wrapper" id="sliderWrapper">
            
            <!-- Slide 1: Foto -->
            <div class="slide">
                <img src="halaL.jpg" alt="Foto Tempat Wisata 1">
                <div class="Label Halal">label Halal</div>
            </div>

            <!-- Slide 2: Video -->
            <div class="slide">
                <!-- Gunakan muted agar video bisa diputar otomatis di browser saat ini -->
                <video src="pembeli.mp4" loop muted playsinline></video>
                <div class="Rekayasa Penjualan">Video</div>
            </div>

            <!-- Slide 3: Foto -->
            <div class="slide">
                <img src="" alt="penjualan">
                <div class="rekayasa">Deskripsi Foto Indah 3</div>
            </div>

            <!-- Slide 4: Video -->
            <div class="slide">
                <video src="https://w3schools.com" loop muted playsinline></video>
                <div class="caption">Deskripsi Video Beruang 4</div>
            </div>

        </div>

        <!-- Tombol Navigasi -->
        <button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>

        <!-- Indikator Titik -->
        <div class="dots-container" id="dotsContainer"></div>
    </div>

    <script>
        const wrapper = document.getElementById('sliderWrapper');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dotsContainer');
        
        let currentIndex = 0;
        let slideInterval;
        const intervalTime = 5000; // Waktu putar otomatis (5 detik)

        // Membuat titik indikator secara dinamis sesuai jumlah slide
        slides.forEach((_, index) => {
            const dot = document.createElement('span');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        // Fungsi mengatur media (putar video jika slide aktif, pause jika tidak)
        function handleMedia(index) {
            slides.forEach((slide, i) => {
                const video = slide.querySelector('video');
                if (video) {
                    if (i === index) {
                        video.currentTime = 0;
                    
                    } else {
                        video.pause();
                    }
                }
            });
        }

        // Fungsi memperbarui posisi slider
        function updateSlider() {
            wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // Perbarui dot aktif
            dots.forEach(dot => dot.classList.remove('active'));
            dots[currentIndex].classList.add('active');

            // Jalankan video jika ada di slide saat ini
            handleMedia(currentIndex);
        }

        // Navigasi tombol kiri/kanan
        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= slides.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = slides.length - 1;
            }
            updateSlider();
            resetTimer();
        }

        // Navigasi lewat klik titik bulat
        function goToSlide(index) {
            currentIndex = index;
            updateSlider();
            resetTimer();
        }

        // Fitur Jalan Otomatis (Autoplay)
        function startTimer() {
            slideInterval = setInterval(() => {
                moveSlide(1);
            }, intervalTime);
        }

        function resetTimer() {
            clearInterval(slideInterval);
            startTimer();
        }

        // Inisialisasi awal saat halaman dimuat
        handleMedia(currentIndex);
        startTimer();
    </script>
</body>
</html>
