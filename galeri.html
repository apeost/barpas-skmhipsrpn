    <title>BarPas</title>
    <style>
        /* --- 1. VARIABEL WARNA ELEGAN (LUXURY THEMING) --- */
        :root {
              /* Memanggil nama file gambar Anda */
    background-image: url('jagabaya.png'); 
    
    /* Membuat gambar memenuhi seluruh layar dan tidak terpotong */
    background-size: cover; 
    
    /* Membuat posisi gambar selalu pas berada di tengah-tengah layar */
    background-position: center; 
    
    /* Membuat gambar background tetap diam saat halaman di-scroll ke bawah */
    background-attachment: fixed; 
    
    /* Mencegah gambar berulang-ulang jika ukurannya terlalu kecil */
    background-repeat: no-repeat; 
    
    /* Warna cadangan jika gambar gagal dimuat akibat internet lambat */
    background-color: #0d0d0d; 
    
    color: #ffffff; /* Warna teks utama tetap putih agar terbaca */
            
            --bg-surface: #17171c;    /* Warna permukaan kotak/kartu */
            --accent-gold: #ff6600;   /* Warna emas mewah untuk aksen */
            --accent-orange: #ffffff; /* Warna BarPas Anda */
            --text-primary: #f5f5f7;  /* Teks utama (putih pudar) */
            --text-muted: #f8f8fc;    /* Teks sekunder (abu-abu halus) */
            --border-color: #ff6600;  /* Garis pembatas halus */
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', system-ui, sans-serif;
        }

        /* --- 2. RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 3. NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding:15px 5%;
            border-bottom: 5px solid var(--border-color);
            background-color: rgba(1, 82, 1, 0.9);
            backdrop-filter: blur(50px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .logo {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 0px;
            color: var(--accent-gold);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap:5px;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: var(--accent-gold);
        }

        /* --- 4. HERO SECTION --- */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 30vh;
            padding:30px;
            background: radial-gradient(circle at center, #1e1e26 0%, var(--bg-dark) 70%);
            /* Mengatur gambar di dalam slide agar rapi dan proporsional */
}
        .story-badge {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing:1px;
            color: var(--accent-gold);
            border: 10px solid var(--accent-gold);
            padding: 2px 50px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: 1000;

/* Animasi memunculkan huruf */
@keyframes mengetik {
    from { width: 0; }
    to { width: 100%; }
}

/* Animasi garis ketik berkedip */
@keyframes kedip {
    50% { border-color: transparent; }
}
            
        }

        .hero h1 {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 100;
            letter-spacing: -1px;
            margin-bottom: 10px;
            max-width: 800px;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 0.8rem;
            max-width: 800px;
            margin-bottom:1px;
            
        }
/* Pengaturan agar gambar responsif 100% mengikuti HP */
        .media img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* --- 5. INTERACTIVE SLIDER SECTION --- */
        .slider-container {
            max-width: 1200px;
            margin: 100px auto;
            padding: 80px;
            background-color: var(--bg-surface);
            border-radius: 20px;
            border: 10px solid var(--border-color);
            box-shadow: rgba(1, 82, 1, 0.9);
            text-align: justify;
             font-size: 0.8rem;
        }
         .slide p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .slide {
            display: none;
        }

        .slide.active {
            display: block;
            animation: fadeIn 0.6s ease-in-out;
        }

        .slide h2 {
            font-family: var(--font-serif);
            font-size: 0.8rem;
            margin-bottom: 20px;
            color: var(--accent-gold);
        }

        
        /* --- 6. ELEGANT BUTTONS --- */
        .slider-buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 12px 28px;
            font-size: 0.8;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--text-primary);
        }

        .btn-primary {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            border: none;
        }

        .btn-primary:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
        }

        /* --- 7. ANIMATION --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
              }
           /* --- 7. RESPONSIVE MEDIA QUERIES (ATURAN KHUSUS LAYAR HP) --- */
        @media (min-width: 768px) {
            .media-container {
                flex-direction: row; /* Di laptop/PC, video dan gambar berjejer ke samping */
                justify-content: center;
            }
            .media-box {
                width: 48%; /* Bagi ruang seimbang saat layar lebar */
            }
            nav.top-nav 
           { padding: 15px 8%;}
        }
        @media (max-width: 600px) {
            nav.top-nav {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            nav.top-nav ul {
                gap: 20px;
            }
            .slider-container {
                margin: 20px 15px;
                padding: 20px 15px;
            }
            .proses-box {
                font-size: 0.8rem;
                gap: 5px;
            }
            .step {
                padding: 4px 8px;
            }
            /* --- 6. ELEGANT BUTTONS --- */
        .slider-buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 1px;
            transition: all 0.3s ease;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--text-primary);
        }

        .btn-primary {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            border: none;
        }

        .btn-primary:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
        }

        /* --- 7. ANIMATION --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }

        }
    </style>

    <!-- WADAH SLIDE INTERAKTIF -->
    <main class="slider-container">
        
        <div class="slide active">
           <center><h2> <b>GALERY</b></h2></center>
     <picture>
    <!-- Jika lebar layar minimal 768px (Laptop/Tablet), tampilkan gambar besar -->
    <source media="(min-width: 768px)" srcset="1logobarPas.png">
    
    <!-- Jika layar di bawah 768px (HP), otomatis pakai gambar kecil ini -->
    <img src="logobarPas.png" alt="Gambar Responsif" style="width: auto; max-width: 100%;">
</picture>

       
        <!-- Tombol Navigasi -->
        <div class="slider-buttons">
            <button class="btn-outline" id="prevBtn">Kembali</button>
            <button class="btn-primary" id="nextBtn">Lanjutkan</button>
        </div>

    <!-- LOGIKA JAVASCRIPT (DI DALAM HTML AGAR LANGSUNG BERJALAN) -->
    <script>
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentSlideIndex = 0;

        function showSlide(index) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[index].classList.add('active');
        }

        nextBtn.addEventListener('click', () => {
            currentSlideIndex++;
            if (currentSlideIndex >= slides.length) {
                currentSlideIndex = 0;
            }
            showSlide(currentSlideIndex);
        });

        prevBtn.addEventListener('click', () => {
            currentSlideIndex--;
            if (currentSlideIndex < 0) {
                currentSlideIndex = slides.length - 1;
            }
            showSlide(currentSlideIndex);
        });
    </script>
