        /* --- 1. VARIABEL WARNA ELEGAN (LUXURY THEMING) --- */

 nav.top-nav {

        /* Container Utama Slider */
        .slider-container {
            position: relative;
            width: 90%;
            max-width: 1000px; /* Maksimal lebar di PC */
            margin: auto;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 8px 50px rgba(0,0,0,0.5);
        }

        /* Wrapper untuk Geser Slide */
        .slider-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        /* Elemen Tiap Slide */
        .slide {
            min-width: 100%;
            position: relative;
         /* Mengatur Aspek Rasio Video/Foto (16:9) */
            aspect-ratio: 16 / 9; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media screen and (max-width: 768px) {

                font-size: 14px;

            }
            .prev { left: 5px; }
            .next { right: 5px; }
            .caption {
                font-size: 11px;
                bottom: 10px;
                left: 10px;
            }
            .dot {
                height: 8px;

            }

    <div class="slider-container">
        <!-- Wrapper Slide -->
        <div class="slider-wrapper" id="sliderWrapper">
            
            <!-- Slide 1: Foto -->
            <div class="slide">
                <img src="halaL.jpg" alt="real">
                <div class="caption">Survei Label Halal</div>
            </div>

            <!-- Slide 2: Foto -->
            <div class="slide">
                <img src="miesalnareal.jpg" alt=real">
                <div class="caption">miesalna</div>
            </div>
           
            <!-- Slide 3: Foto -->
            <div class="slide">
                <img src="experimen.jpg" alt="experiment">
                <div class="caption">tes ketahanan produk</div>
            </div>

            <!-- Slide 4: Video -->
            <div class="slide">
                <video src="pembeli.mp4" loop muted playsinline></video>
                <div class="caption">dokumentasi</div>
            </div>

        </div>

        <!-- Tombol Navigasi -->
        <button class="nav-btn prev" onclick="moveSlide(-1)">&#10094;</button>
        <button class="nav-btn next" onclick="moveSlide(1)">&#10095;</button>

        <!-- Indikator Titik -->
        <div class="dots-container" id="dotsContainer"></div>
    </div>

    <script>
        const wrapper = document.getElementById('sliderWrapper');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dotsContainer');
        
        let currentIndex = 0;
        let slideInterval;
        const intervalTime = 5000; // Waktu putar otomatis (5 detik)

        // Membuat titik indikator secara dinamis sesuai jumlah slide
        slides.forEach((_, index) => {
            const dot = document.createElement('span');
            dot.classList.add('dot');
            if (index === 0) dot.classList.add('active');
            dot.addEventListener('click', () => goToSlide(index));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        // Fungsi mengatur media (putar video jika slide aktif, pause jika tidak)
        function handleMedia(index) {
            slides.forEach((slide, i) => {
                const video = slide.querySelector('video');
                if (video) {
                    if (i === index) {
                        video.currentTime = 0;
                        video.play().catch(error => console.log("Autoplay video tertahan browser"));
                    } else {
                        video.pause();
                    }
                }
            });
        }

        // Fungsi memperbarui posisi slider
        function updateSlider() {
            wrapper.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            // Perbarui dot aktif
            dots.forEach(dot => dot.classList.remove('active'));
            dots[currentIndex].classList.add('active');

            // Jalankan video jika ada di slide saat ini
            handleMedia(currentIndex);
        }

        // Navigasi tombol kiri/kanan
        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= slides.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = slides.length - 1;
            }
            updateSlider();
            resetTimer();
        }

        // Navigasi lewat klik titik bulat
        function goToSlide(index) {
            currentIndex = index;
            updateSlider();
            resetTimer();
        }
       

        function resetTimer() {
            clearInterval(slideInterval);
            startTimer();
        }

        // Inisialisasi awal saat halaman dimuat
        handleMedia(currentIndex);
        startTimer();
    </script>
