<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="2-Klb80tMvBDe_wYjErNAhDr6tYnyNWar053lMtBPEQ" />
     <link rel="icon" type="image/png" href="logo barPas.png">
    <title>BarPas - Barudak Pasirpirin</title>
    <style>
         /* --- 1. VARIABEL WARNA ELEGAN (LUXURY THEMING) --- */
        :root {
              /* Memanggil nama file gambar Anda */
    background-image: url('jagabaya.png'); 
    
    /* Membuat gambar memenuhi seluruh layar dan tidak terpotong */
    background-size: cover; 
    
    /* Membuat posisi gambar selalu pas berada di tengah-tengah layar */
    background-position: center; 
    
    /* Membuat gambar background tetap diam saat halaman di-scroll ke bawah */
    background-attachment: fixed; 
    
    /* Mencegah gambar berulang-ulang jika ukurannya terlalu kecil */
    background-repeat: no-repeat; 
    
    /* Warna cadangan jika gambar gagal dimuat akibat internet lambat */
    background-color: #0d0d0d; 
    
    color: #ffffff; /* Warna teks utama tetap putih agar terbaca */
            }
        /* --- 1. VARIABEL WARNA ELEGAN (LUXURY THEMING) --- */
        :root {
        
            --bg-surface: #17171c;    /* Warna permukaan kotak/kartu */
            --accent-gold: #ff6600;   /* Warna emas/oranye mewah untuk aksen */
            --accent-orange: #ffffff; /* Warna BarPas Anda */
            --text-primary: #f5f5f7;  /* Teks utama (putih pudar) */
            --text-muted: #f8f8fc;    /* Teks sekunder (abu-abu halus) */
            --border-color: #ff6600;  /* Garis pembatas halus */
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', system-ui, sans-serif;
        }

        /* --- 2. RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- 3. NAVIGATION (RESPONSIF HP) --- */
        nav.top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            border-bottom: 3px solid var(--border-color);
            background-color: rgba(1, 82, 1, 0.9);
            backdrop-filter: blur(50px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav.top-nav .logo {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        nav.top-nav ul {
            display: flex;
            list-style: none;
            gap:5px;
        }

        nav.top-nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav.top-nav ul li a:hover {
            color: var(--accent-gold);
        }
        }
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .row-title {
            font-size: 1.5rem;
            margin: 25px 0 10px 0;
            padding-left: 5px;
            border-left: 4px solid #ff4757; /* Aksen merah */
        }
        /* Style Kotak Geser */
        .slider-row {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding-bottom: 15px;
            -webkit-overflow-scrolling: touch;
        }
        .slider-row::-webkit-scrollbar {
            height: 8px;
        }
        .slider-row::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        .slider-row::-webkit-scrollbar-thumb:hover {
            background: #ff4757;
        }
        /* Item di dalam slider */
        .slide-item {
            flex: 0 0 300px; /* Lebar kotak */
            height: 200px;   /* Tinggi kotak */
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            scroll-snap-align: start;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .slide-item:hover {
            transform: scale(1.02);
        }
        /* Pengaturan ukuran video & foto */
        .slide-item video, .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Responsif HP */
        @media (max-width: 600px) {
            .slide-item {
                flex: 0 0 250px;
                height: 160px;
            }
            .row-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        
        <!-- BARIS PERTAMA: SLIDE VIDEO -->
        <h2 class="row-title">🎬 Video Kegiatan BarPas</h2>
        <div class="slider-row">
            <!-- Video 1 -->
            <div class="slide-item">
                <video controls>
                    <source src="pembeli.mp4">
                    Browser Anda tidak mendukung pemutar video.
                </video>
            </div>
            <!-- Video 2 -->
            <div class="slide-item">
                <video controls>
                    <source src="video-barpas-2.mp4" type="video/mp4">
                </video>
            </div>
            <!-- Video 3 -->
            <div class="slide-item">
                <video controls>
                    <source src="video-barpas-3.mp4" type="video/mp4">
                </video>
            </div>
            <!-- Video 4 -->
            <div class="slide-item">
                <video controls>
                    <source src="video-barpas-4.mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <!-- BARIS KEDUA: SLIDE FOTO -->
        <h2 class="row-title">📸 Galeri Foto & MieSalna</h2>
        <div class="slider-row">
            <!-- Foto 1 -->
            <div class="slide-item">
                <img src="foto-miesalna-1.jpg" alt="MieSalna Olahan">
            </div>
            <!-- Foto 2 -->
            <div class="slide-item">
                <img src="foto-barpas-2.jpg" alt="Kumpul BarPas">
            </div>
            <!-- Foto 3 -->
            <div class="slide-item">
                <img src="foto-miesalna-3.jpg" alt="Produk MieSalna">
            </div>
            <!-- Foto 4 -->
            <div class="slide-item">
                <img src="foto-barpas-4.jpg" alt="Kegiatan Komunitas">
            </div>
        </div>

    </div>

</body>
</html>
